<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Controlados — Hospital Pitrufquén</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --azul:       #1B4F8A;
    --azul-oscuro:#13396A;
    --azul-claro: #EBF2FB;
    --rojo:       #C0392B;
    --verde:      #1A7A4A;
    --verde-bg:   #E8F5EE;
    --rojo-bg:    #FDECEA;
    --amarillo:   #E67E22;
    --amarillo-bg:#FEF3E2;
    --gris:       #F4F6F9;
    --borde:      #D0D8E4;
    --texto:      #1C2A3A;
    --texto-suave:#6B7A8D;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--gris);
    color: var(--texto);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--azul);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-icon {
    width: 38px; height: 38px;
    background: white;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
  header p  { font-size: 11px; opacity: 0.8; margin-top: 2px; }

  /* TABS FARMACIA */
  .tabs-wrap {
    background: white;
    border-bottom: 1px solid var(--borde);
    padding: 0 16px;
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  .tab {
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--texto-suave);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all .18s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: inherit;
  }
  .tab:hover { color: var(--azul); }
  .tab.active { color: var(--azul); border-bottom-color: var(--azul); }

  /* MAIN */
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }

  /* CARD */
  .card {
    background: white;
    border-radius: 10px;
    border: 1px solid var(--borde);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--texto-suave);
    margin-bottom: 12px;
  }

  /* METADATOS */
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media(min-width:600px) { .meta-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .meta-field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--texto-suave);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .meta-field input, .meta-field select {
    width: 100%;
    padding: 8px 10px;
    border: 1.5px solid var(--borde);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--texto);
    background: white;
    transition: border-color .15s;
  }
  .meta-field input:focus, .meta-field select:focus {
    outline: none;
    border-color: var(--azul);
  }

  /* RESUMEN */
  .resumen-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .resumen-item {
    flex: 1;
    min-width: 100px;
    background: var(--gris);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
  }
  .resumen-num {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }
  .resumen-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--texto-suave);
    margin-top: 3px;
  }
  .resumen-ok   .resumen-num { color: var(--verde); }
  .resumen-diff .resumen-num { color: var(--rojo); }
  .resumen-warn .resumen-num { color: var(--amarillo); }

  /* TABLA */
  .tabla-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 -16px;
    padding: 0 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    min-width: 750px;
  }
  thead tr {
    background: var(--azul);
    color: white;
  }
  thead th {
    padding: 9px 8px;
    text-align: center;
    font-weight: 600;
    font-size: 11px;
    white-space: nowrap;
    letter-spacing: .03em;
  }
  thead th:first-child,
  thead th:nth-child(2) { text-align: left; }

  tbody tr:nth-child(even) { background: #F8FAFC; }
  tbody tr:hover { background: var(--azul-claro); }

  td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--borde);
    text-align: center;
    vertical-align: middle;
  }
  td:first-child { text-align: left; font-weight: 600; }
  td:nth-child(2) { text-align: left; color: var(--texto-suave); font-size: 11px; }

  td input[type="number"] {
    width: 60px;
    padding: 5px 6px;
    border: 1.5px solid var(--borde);
    border-radius: 5px;
    font-size: 12px;
    text-align: center;
    font-family: inherit;
    background: white;
    transition: border-color .15s;
  }
  td input[type="number"]:focus {
    outline: none;
    border-color: var(--azul);
    background: var(--azul-claro);
  }
  td input[type="number"].sistema-input {
    border-color: #A0B4CC;
    background: #F0F5FA;
  }

  .total-cell {
    font-weight: 700;
    font-size: 13px;
    color: var(--azul-oscuro);
  }

  .diff-cell {
    font-weight: 700;
    font-size: 13px;
    border-radius: 4px;
    padding: 4px 8px;
  }
  .diff-ok     { color: var(--verde);    background: var(--verde-bg); }
  .diff-neg    { color: var(--rojo);     background: var(--rojo-bg); }
  .diff-pos    { color: var(--amarillo); background: var(--amarillo-bg); }

  /* BOTONES */
  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 10px 18px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary   { background: var(--azul); color: white; }
  .btn-success   { background: var(--verde); color: white; }
  .btn-danger    { background: var(--rojo); color: white; }
  .btn-outline   { background: white; color: var(--azul); border: 1.5px solid var(--azul); }
  .btn:hover     { opacity: .88; }

  /* HISTORIAL */
  .historial-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--borde);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .historial-item:hover { background: var(--azul-claro); }
  .historial-fecha {
    font-weight: 700;
    font-size: 13px;
    color: var(--azul);
    min-width: 90px;
  }
  .historial-meta { font-size: 12px; color: var(--texto-suave); flex: 1; }
  .historial-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 12px;
  }
  .badge-ok   { background: var(--verde-bg); color: var(--verde); }
  .badge-diff { background: var(--rojo-bg);  color: var(--rojo); }

  .empty-state {
    text-align: center;
    padding: 30px;
    color: var(--texto-suave);
    font-size: 13px;
  }

  /* NOTA AL PIE */
  .nota {
    font-size: 11px;
    color: var(--texto-suave);
    font-style: italic;
    margin-top: 8px;
  }

  /* PRINT */
  @media print {
    header, .tabs-wrap, .btn-row, .card:has(.historial-item), .no-print { display: none !important; }
    body { background: white; }
    main { padding: 0; }
    .card { border: none; box-shadow: none; page-break-inside: avoid; }
    table { min-width: unset; font-size: 10px; }
    td input { border: none; background: transparent; width: auto; }
    .print-header { display: block !important; }
  }
  .print-header {
    display: none;
    text-align: center;
    margin-bottom: 16px;
  }
  .print-header h2 { font-size: 16px; font-weight: 700; }
  .print-header p  { font-size: 12px; }

  /* MODAL */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 24px;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  .modal h3 { font-size: 16px; margin-bottom: 8px; }
  .modal p  { font-size: 13px; color: var(--texto-suave); margin-bottom: 18px; }
  .modal .btn-row { justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <div class="header-icon">💊</div>
  <div>
    <h1>Stock de Medicamentos Controlados</h1>
    <p>Hospital Pitrufquén — Pauta de supervisión semanal</p>
  </div>
</header>

<div class="tabs-wrap" id="tabsWrap"></div>

<main id="mainContent"></main>

<!-- Modal confirmación -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Confirmar</h3>
    <p id="modalMsg">¿Estás segura?</p>
    <div class="btn-row">
      <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-danger" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────
// DATOS BASE
// ─────────────────────────────────────────────────────────────────
// Si la app corre vía Streamlit (conteo_controlados_app.py), este objeto
// llega inyectado desde controlados_config.json (fuente única). Si el HTML
// se abre suelto (doble clic), se usan las constantes de respaldo de abajo.
const _CFG = (typeof window !== 'undefined' && window.CONTROLADOS_CONFIG) || {};

const FARMACIAS = _CFG.farmacias || [
  { id: 'cerrada',  nombre: 'AT Cerrada',  emoji: '🏥' },
  { id: 'abierta',  nombre: 'AT Abierta',  emoji: '🏪' },
  { id: 'urgencia', nombre: 'Urgencia',    emoji: '🚨' },
];

const MEDICAMENTOS_BASE = _CFG.medicamentos || [
  { nombre: 'Alprazolam',       presentacion: '0,5 mg cm' },
  { nombre: 'Buprenorfina',     presentacion: '10 mcg parche' },
  { nombre: 'Buprenorfina',     presentacion: '35 mcg parche' },
  { nombre: 'Clobazam',         presentacion: '10 mg cm' },
  { nombre: 'Clonazepam',       presentacion: '0,5 mg cm' },
  { nombre: 'Clonazepam',       presentacion: '2 mg cm' },
  { nombre: 'Codeína',          presentacion: '6%' },
  { nombre: 'Diazepam',         presentacion: '10 mg cm' },
  { nombre: 'Diazepam',         presentacion: '10 mg/2 ml am' },
  { nombre: 'Fenobarbital',     presentacion: '15 mg' },
  { nombre: 'Fenobarbital',     presentacion: '100 mg' },
  { nombre: 'Fenobarbital',     presentacion: '200 mg/ml am' },
  { nombre: 'Fentanilo',        presentacion: '25 mcg parche' },
  { nombre: 'Fentanilo',        presentacion: '0,1 mg am' },
  { nombre: 'Fentanilo',        presentacion: '0,5 mg am' },
  { nombre: 'Ketamina',         presentacion: '500 mg/10 ml' },
  { nombre: 'Lisdexanfetamina', presentacion: '50 mg' },
  { nombre: 'Lisdexanfetamina', presentacion: '70 mg' },
  { nombre: 'Lorazepam',        presentacion: '4 mg/ml am' },
  { nombre: 'Lorazepam',        presentacion: '2 mg cm' },
  { nombre: 'Metadona',         presentacion: '10 mg cm' },
  { nombre: 'Metadona',         presentacion: '10 mg/ml am' },
  { nombre: 'Metilfenidato',    presentacion: '10 mg' },
  { nombre: 'Metilfenidato LP', presentacion: '10 mg' },
  { nombre: 'Midazolam',        presentacion: '5 mg/ml am' },
  { nombre: 'Midazolam',        presentacion: '50 mg/10 ml am' },
  { nombre: 'Midazolam',        presentacion: '5 mg/5 ml' },
  { nombre: 'Midazolam',        presentacion: '15 mg/3 ml' },
  { nombre: 'Morfina',          presentacion: '10 mg/ml am' },
  { nombre: 'Morfina',          presentacion: '20 mg/ml am' },
  { nombre: 'Morfina',          presentacion: '30 mg cm' },
  { nombre: 'Morfina',          presentacion: '2% gotas' },
  { nombre: 'Petidina',         presentacion: '100 mg am' },
  { nombre: 'Remifentanilo',    presentacion: '1 mg am' },
  { nombre: 'Remifentanilo',    presentacion: '2 mg am' },
  { nombre: 'Tapentadol',       presentacion: '50 mg' },
  { nombre: 'Zolpidem',         presentacion: '10 mg' },
];

const MEDICAMENTOS = {
  cerrada:  MEDICAMENTOS_BASE,
  abierta:  MEDICAMENTOS_BASE,
  urgencia: MEDICAMENTOS_BASE,
};

const QF_LISTA = _CFG.qf_lista || ['Jose Luis Díaz', 'Jacqueline Valenzuela', 'Otro'];

// ─────────────────────────────────────────────────────────────────
// ESTADO
// ─────────────────────────────────────────────────────────────────
let farmaciaActiva = 'cerrada';
let conteos = {};     // { cerrada: {meta, filas}, abierta: ..., urgencia: ... }
let historial = {};   // { cerrada: [...], abierta: [...], urgencia: [...] }
let vista = 'conteo'; // 'conteo' | 'historial' | 'consolidado'
let consolidado = {}; // { cerrada: conteo, abierta: conteo, urgencia: conteo }
let modalCallback = null;

function initState() {
  const saved = localStorage.getItem('controlados_v2');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      conteos   = data.conteos   || {};
      historial = data.historial || {};
    } catch(e) {}
  }
  FARMACIAS.forEach(f => {
    if (!conteos[f.id]) {
      conteos[f.id] = crearConteoVacio(f.id);
    } else {
      conteos[f.id] = migrarConteo(conteos[f.id], f.id);
    }
    if (!historial[f.id]) historial[f.id] = [];
  });
  guardar();
}

// Agrega medicamentos nuevos de la lista actual que no estén en el conteo guardado,
// sin perder los valores ya ingresados en los que sí existen.
function migrarConteo(conteoGuardado, farmaciaId) {
  const listaActual = MEDICAMENTOS[farmaciaId];
  const existentes = {};
  conteoGuardado.filas.forEach(fila => {
    existentes[`${fila.nombre}|${fila.presentacion}`] = fila;
  });

  const conUrgencia = farmaciaId === 'cerrada';
  const filasNuevas = listaActual.map(m => {
    const key = `${m.nombre}|${m.presentacion}`;
    if (existentes[key]) return existentes[key];
    // Medicamento nuevo: crear fila vacía
    return {
      nombre: m.nombre,
      presentacion: m.presentacion,
      muebleArriba: 0, muebleAbajo: 0, stockRefuerzo: 0,
      actaVencimiento: 0, actaNueva: 0, rp: 0,
      ...(conUrgencia ? { stockUrgencia: 0 } : {}),
      libros: 0, sistema: 0,
    };
  });

  return { meta: conteoGuardado.meta, filas: filasNuevas };
}

function crearConteoVacio(farmaciaId) {
  const conUrgencia = farmaciaId === 'cerrada';
  return {
    meta: {
      qfResponsable: '',
      qfRevisor: '',
      fecha: new Date().toISOString().slice(0,10),
    },
    filas: MEDICAMENTOS[farmaciaId].map(m => ({
      nombre: m.nombre,
      presentacion: m.presentacion,
      muebleArriba: 0,
      muebleAbajo: 0,
      stockRefuerzo: 0,
      actaVencimiento: 0,
      actaNueva: 0,
      rp: 0,
      ...(conUrgencia ? { stockUrgencia: 0 } : {}),
      libros: 0,
      sistema: 0,
    }))
  };
}

function guardar() {
  localStorage.setItem('controlados_v2', JSON.stringify({ conteos, historial }));
}

// ─────────────────────────────────────────────────────────────────
// CÁLCULOS
// ─────────────────────────────────────────────────────────────────
function calcTotal(fila) {
  return (fila.muebleArriba || 0)
       + (fila.muebleAbajo  || 0)
       + (fila.stockRefuerzo || 0)
       + (fila.actaVencimiento || 0)
       + (fila.actaNueva || 0)
       + (fila.rp || 0)
       + (fila.stockUrgencia !== undefined ? (fila.stockUrgencia || 0) : 0);
}

function calcDiff(fila) {
  return calcTotal(fila) - (fila.sistema || 0);
}

// ─────────────────────────────────────────────────────────────────
// RENDER TABS
// ─────────────────────────────────────────────────────────────────
function renderTabs() {
  const wrap = document.getElementById('tabsWrap');
  wrap.innerHTML = FARMACIAS.map(f => `
    <button class="tab ${farmaciaActiva === f.id ? 'active' : ''}"
            onclick="setFarmacia('${f.id}')">
      ${f.emoji} ${f.nombre}
    </button>
  `).join('') + `
    <button class="tab ${vista === 'historial' ? 'active' : ''}"
            onclick="setVista('historial')" style="margin-left:auto">
      📋 Historial
    </button>
    <button class="tab ${vista === 'consolidado' ? 'active' : ''}"
            onclick="setVista('consolidado')" style="background:var(--azul-claro)">
      🔗 Consolidado
    </button>
  `;
}

function setFarmacia(id) {
  farmaciaActiva = id;
  vista = 'conteo';
  renderTabs();
  renderMain();
}

function setVista(v) {
  vista = v;
  renderTabs();
  renderMain();
}

// ─────────────────────────────────────────────────────────────────
// RENDER MAIN
// ─────────────────────────────────────────────────────────────────
function renderMain() {
  if (vista === 'historial')    { renderHistorial();   return; }
  if (vista === 'consolidado')  { renderConsolidado(); return; }
  renderConteo();
}

function renderConteo() {
  const main = document.getElementById('mainContent');
  const f = FARMACIAS.find(f => f.id === farmaciaActiva);
  const c = conteos[farmaciaActiva];
  const filas = c.filas;

  // Resumen
  const total    = filas.length;
  const sinDiff  = filas.filter(f => calcDiff(f) === 0).length;
  const conDiff  = filas.filter(f => calcDiff(f) !== 0).length;
  const sobrante = filas.filter(f => calcDiff(f) > 0).length;

  main.innerHTML = `
    <div class="print-header">
      <h2>Pauta de Supervisión de Stock de Controlados</h2>
      <p>Farmacia ${f.nombre} — Fecha: ${c.meta.fecha}</p>
      <p>QF Responsable: ${c.meta.qfResponsable} | QF Revisor: ${c.meta.qfRevisor}</p>
    </div>

    <!-- Metadatos -->
    <div class="card">
      <div class="card-title">Datos del conteo — ${f.emoji} Farmacia ${f.nombre}</div>
      <div class="meta-grid">
        <div class="meta-field">
          <label>Fecha de conteo</label>
          <input type="date" id="metaFecha" value="${c.meta.fecha}"
                 onchange="updateMeta('fecha', this.value)">
        </div>
        <div class="meta-field">
          <label>QF Responsable del stock</label>
          <input type="text" id="metaQfResp" value="${c.meta.qfResponsable}"
                 placeholder="Nombre QF responsable"
                 onchange="updateMeta('qfResponsable', this.value)">
        </div>
        <div class="meta-field">
          <label>QF Revisor</label>
          <input type="text" id="metaQfRev" value="${c.meta.qfRevisor}"
                 placeholder="Nombre QF revisor"
                 onchange="updateMeta('qfRevisor', this.value)">
        </div>
      </div>
      ${c.meta.stockSistemaFecha ? `<p class="nota">📥 Columna <b>Sistema</b> pre-cargada automáticamente con el stock del día <b>${formatFecha(c.meta.stockSistemaFecha)}</b> (día anterior, SSASUR). Puedes ajustar cada valor; la columna <b>Acta/Vencimiento</b> nunca se modifica.</p>` : ''}
    </div>

    <!-- Resumen -->
    <div class="card no-print">
      <div class="card-title">Resumen</div>
      <div class="resumen-row">
        <div class="resumen-item">
          <div class="resumen-num" style="color:var(--azul)">${total}</div>
          <div class="resumen-label">Medicamentos</div>
        </div>
        <div class="resumen-item resumen-ok">
          <div class="resumen-num">${sinDiff}</div>
          <div class="resumen-label">Sin diferencia</div>
        </div>
        <div class="resumen-item resumen-diff">
          <div class="resumen-num">${conDiff}</div>
          <div class="resumen-label">Con diferencia</div>
        </div>
        <div class="resumen-item resumen-warn">
          <div class="resumen-num">${sobrante}</div>
          <div class="resumen-label">Sobrantes</div>
        </div>
      </div>
    </div>

    <!-- Tabla -->
    <div class="card">
      <div class="card-title">Conteo físico</div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Medicamento</th>
              <th>Presentación</th>
              <th>Mueble↑</th>
              <th>Mueble↓</th>
              <th>Refuerzo</th>
              <th>Acta/Venc.</th>
              <th>Acta Nueva</th>
              <th>RP</th>
              ${farmaciaActiva === 'cerrada' ? '<th>Urgencia</th>' : ''}

            ${filas.map((fila, i) => renderFila(fila, i)).join('')}
          </tbody>
        </table>
      </div>
      <p class="nota">* Diferencia = Total físico − Stock sistema. Verde = sin diferencia, amarillo = sobrante, rojo = faltante.</p>

      <div class="card-title">Acciones</div>

                 onchange="cargarStockSistema(this)">
        </label>` : ''}

      </div>

}

function renderFila(fila, i) {
  const total = calcTotal(fila);
  const diff  = calcDiff(fila);
  const diffClass = diff === 0 ? 'diff-ok' : diff > 0 ? 'diff-pos' : 'diff-neg';
  const diffStr   = diff === 0 ? '✓ 0' : diff > 0 ? `+${diff}` : `${diff}`;
  const conUrgencia = fila.stockUrgencia !== undefined;

  const campos = conUrgencia
    ? ['muebleArriba','muebleAbajo','stockRefuerzo','actaVencimiento','actaNueva','rp','stockUrgencia']
    : ['muebleArriba','muebleAbajo','stockRefuerzo','actaVencimiento','actaNueva','rp'];

  return `<tr>
    <td>${fila.nombre}</td>
    <td>${fila.presentacion}</td>
    ${campos.map(k => `
      <td><input type="number" min="0" value="${fila[k] || 0}"
           onchange="updateFila(${i}, '${k}', this.value)"
           onfocus="this.select()"></td>
    `).join('')}
    <td class="total-cell">${total}</td>
    <td><input type="number" min="0" value="${fila.sistema || 0}"
         class="sistema-input"
         onchange="updateFila(${i}, 'sistema', this.value)"
         onfocus="this.select()"></td>
    <td><span class="diff-cell ${diffClass}">${diffStr}</span></td>
  </tr>`;
}

// ─────────────────────────────────────────────────────────────────
// HISTORIAL
// ─────────────────────────────────────────────────────────────────
function renderHistorial() {
  const main = document.getElementById('mainContent');
  const todos = [];
  FARMACIAS.forEach(f => {
    (historial[f.id] || []).forEach(h => {
      todos.push({ ...h, farmaciaId: f.id, farmaciaNombre: f.nombre, farmaciaEmoji: f.emoji });
    });
  });
  todos.sort((a, b) => b.meta.fecha.localeCompare(a.meta.fecha));

  main.innerHTML = `
    <div class="card">
      <div class="card-title">📋 Historial de conteos guardados</div>
      ${todos.length === 0
        ? '<div class="empty-state">No hay conteos guardados aún.<br>Guarda tu primer conteo desde la pestaña de farmacia.</div>'
        : todos.map((h, i) => {
            const conDiff = h.filas.filter(f => calcDiff(f) !== 0).length;
            return `
              <div class="historial-item" onclick="cargarHistorial('${h.farmaciaId}', ${i})">
                <div class="historial-fecha">${formatFecha(h.meta.fecha)}</div>
                <div class="historial-meta">
                  ${h.farmaciaEmoji} ${h.farmaciaNombre} &nbsp;·&nbsp;
                  QF: ${h.meta.qfResponsable || '—'} &nbsp;·&nbsp;
                  ${h.filas.length} medicamentos
                </div>
                <span class="historial-badge ${conDiff === 0 ? 'badge-ok' : 'badge-diff'}">
                  ${conDiff === 0 ? '✓ Sin diferencias' : conDiff + ' diferencias'}
                </span>
                <button class="btn btn-primary" style="padding:6px 12px;font-size:11px"
                        onclick="event.stopPropagation();exportarHistorialExcel('${h.farmaciaId}', ${i})">
                  📊
                </button>
                <button class="btn btn-danger" style="padding:6px 12px;font-size:11px"
                        onclick="event.stopPropagation();confirmarEliminar('${h.farmaciaId}', ${i})">
                  🗑️
                </button>
              </div>
            `;
          }).join('')
      }
    </div>
  `;
}

function formatFecha(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function updateMeta(campo, valor) {
  conteos[farmaciaActiva].meta[campo] = valor;

}

function updateFila(i, campo, valor) {
  conteos[farmaciaActiva].filas[i][campo] = parseInt(valor) || 0;

function guardarConteo() {
  const c = conteos[farmaciaActiva];
  const copia = JSON.parse(JSON.stringify(c));
  copia.guardadoEn = new Date().toISOString();
  historial[farmaciaActiva].unshift(copia);
  guardar();
  alert('✅ Conteo guardado en el historial.');
}

function cargarHistorial(farmaciaId, idx) {
  const h = historial[farmaciaId][idx];
  farmaciaActiva = farmaciaId;
  vista = 'conteo';
  conteos[farmaciaId] = JSON.parse(JSON.stringify(h));

  abrirModal(
    'Eliminar conteo',

function confirmarNuevoConteo() {
  abrirModal(
    'Nuevo conteo',
    'Se limpiarán los valores del conteo actual, manteniendo Acta/Vencimiento tal como estaba. ¿Continuar?',
    () => {
      const actaVencimientoPrevio = {};
      conteos[farmaciaActiva].filas.forEach(fila => {
        const key = `${fila.nombre}|${fila.presentacion}`;
        actaVencimientoPrevio[key] = fila.actaVencimiento || 0;
      });

      const nuevo = crearConteoVacio(farmaciaActiva);
      nuevo.filas.forEach(fila => {
        const key = `${fila.nombre}|${fila.presentacion}`;
        fila.actaVencimiento = actaVencimientoPrevio[key] || 0;
      });

      conteos[farmaciaActiva] = nuevo;
      guardar();
      renderMain();
    }
  );
}

function exportarExcel(data, nombreArchivo) {
  const c = data || conteos[farmaciaActiva];
  const f = FARMACIAS.find(f => f.id === farmaciaActiva);
  const nombre = nombreArchivo || `Stock_Controlados_${f.nombre.replace(' ','_')}_${c.meta.fecha}.xlsx`;
  const conUrgencia = farmaciaActiva === 'cerrada';

  const colsBase = ['Medicamento','Presentación','Mueble Arriba','Mueble Abajo','Stock Refuerzo',
     'Acta/Vencimiento','Acta Nueva','RP'];
  const colsFin  = ['Total Físico','Stock Sistema','Diferencia'];
  const cols = conUrgencia ? [...colsBase, 'Stock Urgencia', ...colsFin] : [...colsBase, ...colsFin];

  const encabezado = [
    ['PAUTA DE SUPERVISIÓN DE STOCK DE CONTROLADOS'],
    [`Farmacia: ${f ? f.nombre : ''}`],
    [`QF Responsable: ${c.meta.qfResponsable}`, '', `QF Revisor: ${c.meta.qfRevisor}`],
    [`Fecha: ${formatFecha(c.meta.fecha)}`],
    [],
    cols,
  ];

  const filas = c.filas.map(fila => {
    const base = [
      fila.nombre, fila.presentacion,
      fila.muebleArriba||0, fila.muebleAbajo||0, fila.stockRefuerzo||0,
      fila.actaVencimiento||0, fila.actaNueva||0, fila.rp||0,
    ];
    return conUrgencia
      ? [...base, fila.stockUrgencia||0, calcTotal(fila), fila.sistema||0, calcDiff(fila)]
      : [...base, calcTotal(fila), fila.sistema||0, calcDiff(fila)];
  });

  const ws = XLSX.utils.aoa_to_sheet([...encabezado, ...filas]);
  ws['!cols'] = (conUrgencia ? [20,16,12,12,12,14,10,8,12,12,12,12] : [20,16,12,12,12,14,10,8,12,12,12]).map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Stock Controlados');
  XLSX.writeFile(wb, nombre);
}

function exportarHistorialExcel(farmaciaId, idx) {
  const h = historial[farmaciaId][idx];
  const fa = farmaciaActiva;
  farmaciaActiva = farmaciaId;
  const f = FARMACIAS.find(f => f.id === farmaciaId);
  exportarExcel(h, `Stock_${f.nombre.replace(/ /g,'_')}_${h.meta.fecha}.xlsx`);
  farmaciaActiva = fa;
}

  abierta:  MAPEO_SSASUR_BASE,
  urgencia: MAPEO_SSASUR_BASE,
};

const BODEGA_SSASUR = _CFG.bodega_ssasur || {
  cerrada:  'FARMACIA AT CERRADA',
  abierta:  'FARMACIA AT ABIERTA',
  urgencia: null,
};

function cargarStockSistema(input) {
  const file = input.files[0];
  if (!file) return;

  const bodega = BODEGA_SSASUR[farmaciaActiva];

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb   = XLSX.read(data, { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

      // Buscar fila de encabezado: puede tener 'Bodega'+'Descripción' (reporte general)
      // o 'Producto' sin 'Bodega' (reporte de una sola farmacia, ej. AT Abierta)
      let headerRow = -1;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i].includes('Descripción') || rows[i].includes('Producto')) { headerRow = i; break; }
      }
      if (headerRow === -1) throw new Error('No se reconoce el formato del archivo (falta columna Descripción o Producto)');

      const headers   = rows[headerRow];
      const colBodega = headers.indexOf('Bodega'); // -1 si no existe (reporte de una sola farmacia)
      const colDesc   = headers.indexOf('Descripción') !== -1 ? headers.indexOf('Descripción') : headers.indexOf('Producto');
      const colCant   = headers.indexOf('Cantidad');

      const tieneBodega = colBodega !== -1;

      if (tieneBodega && !bodega) {
        alert('⚠️ Este reporte tiene varias bodegas pero Urgencia no tiene bodega definida. Ingresa el stock manualmente.');
        input.value = '';
        return;
      }

      // Construir mapa descripcion -> cantidad
      const stockMap = {};
      for (let i = headerRow + 1; i < rows.length; i++) {
        const row = rows[i];
        if (tieneBodega) {
          // Reporte general: filtrar por bodega de la farmacia activa
          if (String(row[colBodega]).trim() !== bodega) continue;
        }
        const desc = String(row[colDesc]).trim();
        const cant = Number(row[colCant]) || 0;
        if (desc) stockMap[desc] = cant;
      }

      if (Object.keys(stockMap).length === 0) {
        throw new Error('No se encontraron filas de stock para esta farmacia en el archivo.');
      }

      // Aplicar al conteo actual
      const mapeo = MAPEO_SSASUR[farmaciaActiva] || {};
      let cargados = 0, noEncontrados = [];

      conteos[farmaciaActiva].filas.forEach(fila => {
        const key = `${fila.nombre}|${fila.presentacion}`;
        const nombreSsasur = mapeo[key];
        if (nombreSsasur && stockMap[nombreSsasur] !== undefined) {
          fila.sistema = stockMap[nombreSsasur];
          cargados++;
        } else if (nombreSsasur) {
          noEncontrados.push(fila.nombre + ' ' + fila.presentacion);
        }
      });

      guardar();
      renderMain();

      let msg = `✅ Stock del sistema cargado: ${cargados} medicamentos actualizados.`;
      if (noEncontrados.length > 0) {
        msg += `\n\n⚠️ No encontrados en el reporte (quedan en 0):\n${noEncontrados.join('\n')}`;
      }
      alert(msg);
    } catch(err) {
      alert('❌ Error al leer el reporte de stock: ' + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
  input.value = '';
}

// ─────────────────────────────────────────────────────────────────
// CARGAR STOCK DEL SISTEMA DESDE stock_sistema.json (el que genera AUTO_SSASUR)
// Sirve cuando el HTML se abre suelto (doble clic) y no hay inyección de
// Streamlit: la QF elige el archivo Conteo_Controlados/stock_sistema.json y se
// llena la columna Sistema de cada bodega. Fuerza la carga (ignora el candado
// "una vez por fecha") porque es una acción explícita. NO toca Acta/Vencimiento.
// ─────────────────────────────────────────────────────────────────
function cargarStockJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const pf = data.porFarmacia || data;   // acepta {porFarmacia:{...}} o el mapa directo
      if (!pf || typeof pf !== 'object') throw new Error('El JSON no tiene "porFarmacia".');
      let farmOk = 0; const detalle = [];
      FARMACIAS.forEach(f => {
        const entry = pf[f.id];
        if (!entry) return;
        const stockFarm = entry.stock || entry;          // formato {fecha,stock} o plano
        const fecha = entry.fecha || data.fecha || '';
        const c = conteos[f.id];
        if (!c) return;
        let n = 0;
        c.filas.forEach(fila => {
          const key = `${fila.nombre}|${fila.presentacion}`;
          if (stockFarm[key] !== undefined) { fila.sistema = stockFarm[key]; n++; }
          // NO se toca fila.actaVencimiento — ese lo maneja la QF a mano.
        });
        c.meta.stockSistemaFecha = fecha;
        farmOk++;
        detalle.push(`${f.emoji} ${f.nombre}: ${n} ítems${fecha ? ' (' + formatFecha(fecha) + ')' : ''}`);
      });
      guardar();
      renderMain();
      alert(farmOk
        ? `✅ Stock del sistema cargado.\n\n${detalle.join('\n')}`
        : '⚠️ El JSON no traía datos por farmacia reconocibles.');
    } catch(err) {
      alert('❌ No se pudo leer el JSON de stock: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function importarJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.farmaciaId || !data.conteo) throw new Error('Formato inválido');
      const fNombre = data.farmaciaNombre || data.farmaciaId;
      consolidado[data.farmaciaId] = data.conteo;

      // Guardar también en el historial de esa farmacia (evitando duplicados por fecha)
      if (!historial[data.farmaciaId]) historial[data.farmaciaId] = [];
      const fechaNueva = data.conteo.meta.fecha;
      const yaExiste = historial[data.farmaciaId].some(h => h.meta.fecha === fechaNueva);

      if (!yaExiste) {
        const copia = JSON.parse(JSON.stringify(data.conteo));
        copia.guardadoEn = new Date().toISOString();
        copia.importadoDesde = fNombre;
        historial[data.farmaciaId].unshift(copia);
        guardar();
        alert(`✅ Conteo de ${fNombre} cargado y guardado en el historial.`);
      } else {
        guardar();
        alert(`✅ Conteo de ${fNombre} cargado.\n\nYa existía un conteo de esa fecha (${formatFecha(fechaNueva)}) en el historial — no se duplicó.`);
      }

      renderConsolidado();
    } catch(err) {
      alert('❌ Error al leer el archivo. Asegúrate de que es un archivo JSON exportado desde esta app.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ─────────────────────────────────────────────────────────────────
// VISTA CONSOLIDADA
// ─────────────────────────────────────────────────────────────────
function renderConsolidado() {
  const main = document.getElementById('mainContent');
  const cargadas = FARMACIAS.filter(f => consolidado[f.id]);
  const faltantes = FARMACIAS.filter(f => !consolidado[f.id]);

  // Reunir todos los medicamentos únicos
  const medMap = {}; // 'nombre|presentacion' -> { nombre, presentacion, porFarmacia: {id: fila} }
  FARMACIAS.forEach(f => {
    if (!consolidado[f.id]) return;
    consolidado[f.id].filas.forEach(fila => {
      const key = `${fila.nombre}|${fila.presentacion}`;
      if (!medMap[key]) medMap[key] = { nombre: fila.nombre, presentacion: fila.presentacion, porFarmacia: {} };
      medMap[key].porFarmacia[f.id] = fila;
    });
  });

  const meds = Object.values(medMap).sort((a,b) => a.nombre.localeCompare(b.nombre));
  const totalDiff = meds.reduce((acc, m) => {
    return acc + FARMACIAS.filter(f => consolidado[f.id]).reduce((s, f) => {
      const fila = m.porFarmacia[f.id];
      return s + (fila ? Math.abs(calcDiff(fila)) : 0);
    }, 0);
  }, 0);

  main.innerHTML = `
    <div class="card">
      <div class="card-title">🔗 Vista consolidada — todas las farmacias</div>

      <!-- Estado de carga -->
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        ${FARMACIAS.map(f => {
          const ok = !!consolidado[f.id];
          const fecha = ok ? formatFecha(consolidado[f.id].meta.fecha) : null;
          return `
            <div style="flex:1;min-width:160px;padding:12px;border-radius:8px;
                        border:2px solid ${ok ? 'var(--verde)' : 'var(--borde)'};
                        background:${ok ? 'var(--verde-bg)' : 'var(--gris)'}">
              <div style="font-weight:700;font-size:13px;color:${ok ? 'var(--verde)' : 'var(--texto-suave)'}">
                ${f.emoji} ${f.nombre}
              </div>
              <div style="font-size:11px;margin-top:3px;color:var(--texto-suave)">
                ${ok ? `✓ Cargado · ${fecha}` : 'Sin datos'}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <!-- Importar archivos -->
      <div style="margin-bottom:16px">
        <div class="card-title">Importar conteos de otras farmacias</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${FARMACIAS.map(f => `
            <label class="btn btn-outline" style="cursor:pointer">
              📂 Cargar ${f.nombre}
              <input type="file" accept=".json" style="display:none"
                     onchange="importarJSON(this)">
            </label>
          `).join('')}
          <button class="btn btn-outline" onclick="usarConteosActuales()">
            ⚡ Usar conteos actuales
          </button>
        </div>
        <p class="nota" style="margin-top:8px">
          Importa los archivos JSON exportados desde cada farmacia, o usa "Usar conteos actuales" si ya tienes los tres en este PC.
        </p>
      </div>

      ${cargadas.length === 0
        ? '<div class="empty-state">Importa al menos un conteo para ver el consolidado.</div>'
        : `
          <!-- Resumen consolidado -->
          <div class="resumen-row" style="margin-bottom:16px">
            <div class="resumen-item">
              <div class="resumen-num" style="color:var(--azul)">${cargadas.length}/3</div>
              <div class="resumen-label">Farmacias</div>
            </div>
            <div class="resumen-item resumen-diff">
              <div class="resumen-num">${totalDiff}</div>
              <div class="resumen-label">Total diferencias</div>
            </div>
            <div class="resumen-item resumen-ok">
              <div class="resumen-num">${meds.filter(m =>
                FARMACIAS.filter(f => consolidado[f.id]).every(f => {
                  const fila = m.porFarmacia[f.id];
                  return !fila || calcDiff(fila) === 0;
                })
              ).length}</div>
              <div class="resumen-label">Sin diferencias</div>
            </div>
          </div>

          <!-- Tabla consolidada -->
          <div class="tabla-wrap">
            <table>
              <thead>
                <tr>
                  <th>Medicamento</th>
                  <th>Presentación</th>
                  ${cargadas.map(f => `<th colspan="2">${f.emoji} ${f.nombre}</th>`).join('')}
                </tr>
                <tr style="background:var(--azul-oscuro)">
                  <th></th><th></th>
                  ${cargadas.map(() => '<th>Total</th><th>Dif.</th>').join('')}
                </tr>
              </thead>
              <tbody>
                ${meds.map(m => {
                  const celdas = cargadas.map(f => {
                    const fila = m.porFarmacia[f.id];
                    if (!fila) return '<td>—</td><td>—</td>';
                    const total = calcTotal(fila);
                    const diff  = calcDiff(fila);
                    const cls   = diff === 0 ? 'diff-ok' : diff > 0 ? 'diff-pos' : 'diff-neg';
                    const str   = diff === 0 ? '✓' : diff > 0 ? `+${diff}` : `${diff}`;
                    return `<td class="total-cell">${total}</td>
                            <td><span class="diff-cell ${cls}" style="padding:2px 6px;font-size:11px">${str}</span></td>`;
                  }).join('');
                  return `<tr><td>${m.nombre}</td><td>${m.presentacion}</td>${celdas}</tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>

          <!-- Exportar consolidado -->
          <div class="btn-row" style="margin-top:16px">
            <button class="btn btn-success" onclick="exportarConsolidadoExcel()">📊 Exportar Excel consolidado</button>
            <button class="btn btn-primary" onclick="imprimirPDF()">🖨️ Imprimir / PDF consolidado</button>
          </div>
        `
      }
    </div>
  `;
}

function usarConteosActuales() {
  FARMACIAS.forEach(f => { consolidado[f.id] = JSON.parse(JSON.stringify(conteos[f.id])); });
  renderConsolidado();
}

function exportarConsolidadoExcel() {
  const cargadas = FARMACIAS.filter(f => consolidado[f.id]);
  if (cargadas.length === 0) { alert('No hay conteos cargados.'); return; }

  const wb = XLSX.utils.book_new();

  // Hoja por cada farmacia
  cargadas.forEach(f => {
    const c = consolidado[f.id];
    const enc = [
      ['PAUTA DE SUPERVISIÓN DE STOCK DE CONTROLADOS'],
      [`Farmacia: ${f.nombre}`],
      [`QF Responsable: ${c.meta.qfResponsable}`, '', `QF Revisor: ${c.meta.qfRevisor}`],
      [`Fecha: ${formatFecha(c.meta.fecha)}`],
      [],
      ['Medicamento','Presentación','Mueble Arriba','Mueble Abajo','Stock Refuerzo',
       'Acta/Vencimiento','Acta Nueva','RP','Stock Urgencia','Total Físico','Stock Sistema','Diferencia'],
    ];
    const filas = c.filas.map(fila => [
      fila.nombre, fila.presentacion,
      fila.muebleArriba||0, fila.muebleAbajo||0, fila.stockRefuerzo||0,
      fila.actaVencimiento||0, fila.actaNueva||0, fila.rp||0, fila.stockUrgencia||0,
      calcTotal(fila), fila.sistema||0, calcDiff(fila),
    ]);
    const ws = XLSX.utils.aoa_to_sheet([...enc, ...filas]);
    ws['!cols'] = [20,16,12,12,12,14,10,8,12,12,12,12].map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, f.nombre);
  });

  // Hoja resumen consolidado
  const medMap = {};
  FARMACIAS.forEach(f => {
    if (!consolidado[f.id]) return;
    consolidado[f.id].filas.forEach(fila => {
      const key = `${fila.nombre}|${fila.presentacion}`;
      if (!medMap[key]) medMap[key] = { nombre: fila.nombre, presentacion: fila.presentacion, porFarmacia: {} };
      medMap[key].porFarmacia[f.id] = fila;
    });
  });

  const encRes = [
    ['RESUMEN CONSOLIDADO — STOCK DE CONTROLADOS'],
    [`Generado: ${formatFecha(new Date().toISOString().slice(0,10))}`],
    [],
    ['Medicamento','Presentación',
     ...cargadas.flatMap(f => [`${f.nombre} Total`, `${f.nombre} Dif.`])
    ],
  ];
  const filasRes = Object.values(medMap)
    .sort((a,b) => a.nombre.localeCompare(b.nombre))
    .map(m => [
      m.nombre, m.presentacion,
      ...cargadas.flatMap(f => {
        const fila = m.porFarmacia[f.id];
        return fila ? [calcTotal(fila), calcDiff(fila)] : ['—','—'];
      }),
    ]);

  const wsRes = XLSX.utils.aoa_to_sheet([...encRes, ...filasRes]);
  wsRes['!cols'] = [20,16,...cargadas.flatMap(() => [12,10])].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, wsRes, 'Consolidado');

  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Stock_Controlados_Consolidado_${fecha}.xlsx`);
}

// ─────────────────────────────────────────────────────────────────
// STOCK DEL SISTEMA INYECTADO (vía Streamlit) — la FECHA depende de la bodega:
// AT Cerrada = día ACTUAL, AT Abierta = día ANTERIOR (para contar).
// conteo_controlados_app.py lee stock_sistema.json (lo genera AUTO_SSASUR desde
// el Reporte Stock en Fecha) y lo deja en window.STOCK_SISTEMA_INYECTADO.
// Estructura: { generadoEn, porFarmacia:{ cerrada:{fecha,dia,stock:{'nombre|pres':cant}}, abierta:{...} } }
// (compat: si porFarmacia[id] es un objeto plano clave→cant, también se acepta.)
// Solo se aplica UNA vez por fecha nueva (no pisa ediciones manuales en cada
// recarga) y SOLO toca la columna Sistema — nunca Acta/Vencimiento.
// ─────────────────────────────────────────────────────────────────
function aplicarStockInyectado() {
  const inj = (typeof window !== 'undefined' && window.STOCK_SISTEMA_INYECTADO) || null;
  if (!inj || !inj.porFarmacia) return;
  let algo = false;
  FARMACIAS.forEach(f => {
    const entry = inj.porFarmacia[f.id];
    if (!entry) return;                              // sin bodega (ej. Urgencia) → queda manual
    const stockFarm = entry.stock || entry;          // formato nuevo {fecha,stock} o plano
    const fecha = entry.fecha || inj.fecha || '';
    const c = conteos[f.id];
    if (!c) return;
    if (fecha && c.meta.stockSistemaFecha === fecha) return;  // ya aplicado este día
    c.filas.forEach(fila => {
      const key = `${fila.nombre}|${fila.presentacion}`;
      if (stockFarm[key] !== undefined) fila.sistema = stockFarm[key];
      // NO se toca fila.actaVencimiento — ese lo maneja la QF a mano.
    });
    c.meta.stockSistemaFecha = fecha;
    algo = true;
  });
  if (algo) guardar();
}

// ─────────────────────────────────────────────────────────────────
initState();
aplicarStockInyectado();
renderTabs();
renderMain();
</script>
